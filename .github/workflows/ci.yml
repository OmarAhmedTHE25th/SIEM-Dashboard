name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all Python sources
        run: python -m compileall -q . -x '\.venv|__pycache__'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run detection fixtures
        run: python -m unittest tests.test_detections -v

      - name: Run detector-coverage check
        run: python scripts/check_detector_coverage.py

      - name: Run validation script
        run: bash scripts/validate_detections.sh

      - name: Verify ATT&CK coverage doc matches code
        run: python -m unittest tests.test_attack_coverage_doc -v